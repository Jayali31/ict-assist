      <div class="flex gap-1 text-xs bg-slate-200 p-1 rounded-xl">
        <button type="button" onclick="renderTable('All')" id="btn-All" class="px-3 py-1 rounded-lg bg-white font-semibold text-blue-600 shadow-xs">All</button>
        <button type="button" onclick="renderTable('Pending')" id="btn-Pending" class="px-3 py-1 rounded-lg text-slate-600">Pending</button>
        <button type="button" onclick="renderTable('In Progress')" id="btn-InProgress" class="px-3 py-1 rounded-lg text-slate-600">In Progress</button>
        <button type="button" onclick="renderTable('Resolved')" id="btn-Resolved" class="px-3 py-1 rounded-lg text-slate-600">Resolved</button>
      </div>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-xs">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-50 border-b border-slate-100 text-slate-400 uppercase tracking-wider text-[10px]">
          <tr>
            <th class="py-3 px-6">ID</th>
            <th class="py-3 px-4">Title</th>
            <th class="py-3 px-4">Category</th>
            <th class="py-3 px-4">Priority</th>
            <th class="py-3 px-4">Status</th>
            <th class="py-3 px-4">Assigned Tech</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </main>

  <script>
    lucide.createIcons();

    // Default mock data for standalone/offline viewing
    function getTickets() {
      return [
        { id: 'TX-2027', title: 'Printer not responding', branch: 'Colombo Head Office', category: 'Printer', priority: 'High', status: 'Pending', assignedTo: '' },
        { id: 'TX-2025', title: 'Server room AC filters maintenance', branch: 'Head Office', category: 'Hardware', priority: 'Medium', status: 'Pending', assignedTo: '' },
        { id: 'TX-2024', title: 'Printer not working', branch: 'Finance Dept', category: 'Hardware', priority: 'High', status: 'In Progress', assignedTo: 'K.P. Ratnasiri' },
        { id: 'TX-2021', title: 'Windows 11 update crash & Office suite', branch: 'Finance', category: 'Software', priority: 'Low', status: 'Resolved', assignedTo: 'M.E. Perera' }
      ];
    }

    function renderTable(filter = 'All') {
      const all = getTickets();
      const list = filter === 'All' ? all : all.filter(t => t.status === filter);
      const tbody = document.getElementById('table-body');
      
      const tabs = ['All', 'Pending', 'In Progress', 'Resolved'];
      tabs.forEach(tab => {
        const id = 'btn-' + tab.replace(' ', '');
        const btn = document.getElementById(id);
        if (btn) {
          if (tab === filter) {
            btn.className = 'px-3 py-1 rounded-lg bg-white font-semibold text-blue-600 shadow-xs';
          } else {
            btn.className = 'px-3 py-1 rounded-lg text-slate-600';
          }
        }
      });

      tbody.innerHTML = list.map(t => `
        <tr class="hover:bg-slate-50 transition cursor-pointer" onclick="window.location.href='ticket.php?id=${t.id.replace('TX-','')}'">
          <td class="py-3.5 px-6 font-mono font-bold text-blue-600">#${t.id}</td>
          <td class="py-3.5 px-4 font-semibold text-slate-800">${t.title}<div class="text-[10px] text-slate-400 mt-0.5">${t.branch}</div></td>
          <td class="py-3.5 px-4 text-slate-500">${t.category}</td>
          <td class="py-3.5 px-4"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${t.priority === 'High' ? 'bg-rose-50 text-rose-600' : 'bg-amber-50 text-amber-600'}">${t.priority}</span></td>
          <td class="py-3.5 px-4"><span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${t.status === 'Resolved' ? 'bg-emerald-50 text-emerald-700' : t.status === 'In Progress' ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700'}">${t.status}</span></td>
          <td class="py-3.5 px-4 text-slate-600">${t.assignedTo || '<span class="text-slate-400 italic">Unassigned</span>'}</td>
        </tr>
      `).join('');
    }
    renderTable();
  </script>
</body>
</html>
