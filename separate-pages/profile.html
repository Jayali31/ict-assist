<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile - ICT Assist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 flex min-h-screen">
  <aside class="w-64 bg-[#111827] text-slate-300 min-h-screen flex flex-col justify-between p-4 border-r border-slate-800">
    <div class="p-3 border-b border-slate-800 flex items-center space-x-3 mb-4">
      <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white"><i data-lucide="monitor" class="w-5 h-5"></i></div>
      <div><h1 class="text-sm font-bold text-white">ICT Assist</h1><p class="text-[11px] text-slate-400">User Profile</p></div>
    </div>
    <nav class="space-y-1 text-xs font-semibold">
      <a href="employee-dashboard.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Back to Dashboard</span></a>
      <a href="login.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-rose-400 hover:bg-rose-500/10"><i data-lucide="log-out" class="w-4 h-4"></i><span>Sign Out</span></a>
    </nav>
  </aside>

  <main class="flex-1 p-8 max-w-xl mx-auto space-y-6">
    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white rounded-3xl p-8 text-center shadow-xl">
      <div class="w-20 h-20 rounded-full bg-white/20 text-2xl font-bold flex items-center justify-center mx-auto mb-3">AE</div>
      <h2 class="text-xl font-bold">A.M. Emandi</h2>
      <p class="text-xs text-blue-200">Employee &bull; Accounts & Administration</p>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-xs space-y-3 text-xs">
      <div class="flex justify-between py-2 border-b border-slate-100">
        <span class="text-slate-400">Email:</span>
        <strong class="text-slate-800">a.m.emandi@ictassist.com</strong>
      </div>
      <div class="flex justify-between py-2 border-b border-slate-100">
        <span class="text-slate-400">Branch:</span>
        <strong class="text-slate-800">Colombo Main Office</strong>
      </div>
      <div class="flex justify-between py-2 border-b border-slate-100">
        <span class="text-slate-400">Department:</span>
        <strong class="text-slate-800">Accounts & Finance</strong>
      </div>
      <div class="flex justify-between py-2">
        <span class="text-slate-400">Role:</span>
        <strong class="text-blue-600">Employee</strong>
      </div>
    </div>
  </main>
  <script>lucide.createIcons();</script>

</html>
