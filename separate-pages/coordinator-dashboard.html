<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coordinator Dashboard - ICT Assist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-slate-100 flex min-h-screen">
  <aside class="w-64 bg-[#111827] text-slate-300 min-h-screen flex flex-col justify-between p-4 border-r border-slate-800">
    <div>
      <div class="p-3 border-b border-slate-800 flex items-center space-x-3 mb-4">
        <div class="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center text-white"><i data-lucide="monitor" class="w-5 h-5"></i></div>
        <div>
          <h1 class="text-sm font-bold text-white">ICT Assist</h1>
          <p class="text-[11px] text-slate-400">Coordinator Dispatch</p>
        </div>
      </div>
      <nav class="space-y-1 text-xs font-semibold">
        <a href="coordinator-dashboard.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-purple-600 text-white"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Dashboard</span></a>
        <a href="ticket-status.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="clock" class="w-4 h-4"></i><span>All Tickets</span></a>
        <a href="reports.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="bar-chart-3" class="w-4 h-4"></i><span>Reports & Stats</span></a>
        <a href="notifications.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="bell" class="w-4 h-4"></i><span>Notifications</span></a>
      </nav>
    </div>
    <div class="space-y-2 pt-4 border-t border-slate-800 text-xs">
      <div class="grid grid-cols-2 gap-1">
        <a href="employee-dashboard.html" class="p-1.5 bg-slate-800 text-center rounded hover:bg-blue-600 text-white text-[11px]">Employee</a>
        <a href="staff-dashboard.html" class="p-1.5 bg-slate-800 text-center rounded hover:bg-blue-600 text-white text-[11px]">Staff</a>
      </div>
      <a href="login.html" class="block p-2 text-center text-rose-400 hover:bg-rose-500/10 rounded-xl">Sign Out</a>
    </div>
  </aside>

  <main class="flex-1 p-8 max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
      <div>
        <span class="text-xs font-bold text-purple-600 uppercase">Dispatch Management</span>
        <h2 class="text-2xl font-extrabold text-slate-900 mt-0.5">Coordinator Dashboard</h2>
      </div>
      <a href="reports.html" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold hover:border-purple-500 transition">
        Analytics Reports &rarr;
      </a>
    </div>

    <!-- 4 Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">
        <span class="text-xs uppercase font-bold text-slate-400">Total</span>
        <h3 id="stat-total" class="text-2xl font-extrabold text-slate-800 mt-1">0</h3>
      </div>
      <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">
        <span class="text-xs uppercase font-bold text-slate-400">Resolved</span>
        <h3 id="stat-resolved" class="text-2xl font-extrabold text-emerald-600 mt-1">0</h3>
      </div>
      <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">
        <span class="text-xs uppercase font-bold text-slate-400">Pending</span>
        <h3 id="stat-pending" class="text-2xl font-extrabold text-amber-500 mt-1">0</h3>
      </div>
      <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">
        <span class="text-xs uppercase font-bold text-slate-400">In Progress</span>
        <h3 id="stat-inprogress" class="text-2xl font-extrabold text-purple-600 mt-1">0</h3>
      </div>
    </div>

    <!-- Pending Queue -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-xs">
      <h3 class="text-sm font-bold text-slate-800 mb-3">Pending Incident Assignments</h3>
      <div id="pending-list" class="divide-y divide-slate-100"></div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function refreshCoordinator() {
      const tickets = getTickets();
      const pending = tickets.filter(t => t.status === 'Pending');
      
      document.getElementById('stat-total').innerText = tickets.length;
      document.getElementById('stat-resolved').innerText = tickets.filter(t => t.status === 'Resolved').length;
      document.getElementById('stat-pending').innerText = pending.length;
      document.getElementById('stat-inprogress').innerText = tickets.filter(t => t.status === 'In Progress').length;

      const container = document.getElementById('pending-list');
      if (pending.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 py-6 text-center">🎉 No pending assignments! All tickets assigned.</p>';
        return;
      }

      container.innerHTML = pending.map(t => `
        <div class="py-3.5 flex justify-between items-center text-xs">
          <div>
            <span class="font-bold text-slate-800">#${t.id} ${t.title}</span>
            <p class="text-[11px] text-slate-400">${t.branch} • ${t.department} • Priority: <span class="text-rose-600 font-bold">${t.priority}</span></p>
          </div>
          <button onclick="assignTech('${t.id}')" class="px-3.5 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-semibold shadow-xs transition">
            Assign Technician
          </button>
        </div>
      `).join('');
    }

    function assignTech(ticketId) {
      const techs = ['K.P. Ratnasiri', 'A.S. Fernando', 'M.E. Perera'];
      const chosen = prompt("Enter technician name to assign:", techs[0]);
      if (chosen) {
        updateTicket(ticketId, { status: 'In Progress', assignedTo: chosen });
        alert(`Technician ${chosen} assigned to ticket #${ticketId}!`);
        refreshCoordinator();
      }
    }

    refreshCoordinator();
  </script>
</body>
</html>
