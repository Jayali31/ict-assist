<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Request - ICT Assist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-slate-100 flex min-h-screen">
  <aside class="w-64 bg-[#111827] text-slate-300 min-h-screen flex flex-col justify-between p-4 border-r border-slate-800">
    <div>
      <div class="p-3 border-b border-slate-800 flex items-center space-x-3 mb-4">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white"><i data-lucide="monitor" class="w-5 h-5"></i></div>
        <div>
          <h1 class="text-sm font-bold text-white">ICT Assist</h1>
          <p class="text-[11px] text-slate-400">Employee Portal</p>
        </div>
      </div>
      <nav class="space-y-1 text-xs font-semibold">
        <a href="employee-dashboard.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Dashboard</span></a>
        <a href="new-request.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-blue-600 text-white"><i data-lucide="plus-circle" class="w-4 h-4"></i><span>New Request</span></a>
        <a href="ticket-status.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="clock" class="w-4 h-4"></i><span>Ticket Status</span></a>
        <a href="notifications.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="bell" class="w-4 h-4"></i><span>Notifications</span></a>
        <a href="profile.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="user" class="w-4 h-4"></i><span>Profile</span></a>
      </nav>
    </div>
  </aside>

  <main class="flex-1 p-8 max-w-4xl mx-auto space-y-4">
    <a href="employee-dashboard.html" class="text-xs text-slate-500 hover:text-slate-800 flex items-center gap-1"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Dashboard</a>
    
    <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-xs">
      <h2 class="text-lg font-bold text-slate-900 pb-2 border-b border-slate-100">Submit New Incident Request</h2>
      
      <form onsubmit="handleFormSubmit(event)" class="mt-6 space-y-4 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold uppercase text-slate-600 mb-1">Branch Name</label>
            <input type="text" id="branch" value="Colombo Main Office" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500" required />
          </div>
          <div>
            <label class="block font-bold uppercase text-slate-600 mb-1">Department</label>
            <input type="text" id="dept" value="Accounts & Admin" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500" required />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold uppercase text-slate-600 mb-1">Category</label>
            <select id="category" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500">
              <option value="Hardware">Hardware (Printer, PC, Network Cable)</option>
              <option value="Network">Network (Wi-Fi, Router, Switch)</option>
              <option value="Software">Software (OS, Antivirus, MS Office)</option>
              <option value="Telephone">Telephone (VoIP, Extension line)</option>
            </select>
          </div>
          <div>
            <label class="block font-bold uppercase text-slate-600 mb-1">Priority</label>
            <select id="priority" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500">
              <option value="High">High (Immediate work stoppage)</option>
              <option value="Medium" selected>Medium Priority</option>
              <option value="Low">Low Priority</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-bold uppercase text-slate-600 mb-1">Issue Title</label>
          <input type="text" id="title" placeholder="e.g. Laser printer paper feed jammed" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500" required />
        </div>

        <div>
          <label class="block font-bold uppercase text-slate-600 mb-1">Detailed Description</label>
          <textarea id="desc" rows="3" placeholder="Provide details, room number, or error messages..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500" required></textarea>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition">
          Submit Incident Request
        </button>
      </form>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function handleFormSubmit(e) {
      e.preventDefault();
      const currentList = getTickets();
      const newId = 'TX-' + (2027 + currentList.length);
      const ticket = {
        id: newId,
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        priority: document.getElementById('priority').value,
        department: document.getElementById('dept').value,
        branch: document.getElementById('branch').value,
        status: 'Pending',
        assignedTo: null,
        createdDate: new Date().toISOString().split('T')[0],
        description: document.getElementById('desc').value
      };
      addTicket(ticket);
      alert('Ticket #' + newId + ' created successfully! Redirecting to Ticket Status...');
      window.location.href = 'ticket-status.html';
    }
  </script>
</body>
</html>
