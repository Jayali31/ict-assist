<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ticket Status - ICT Assist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="shared.js"></script>
</head>
<body class="bg-slate-100 flex min-h-screen">
  <aside class="w-64 bg-[#111827] text-slate-300 min-h-screen flex flex-col justify-between p-4 border-r border-slate-800">
    <div>
      <div class="p-3 border-b border-slate-800 flex items-center space-x-3 mb-4">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white"><i data-lucide="monitor" class="w-5 h-5"></i></div>
        <div>
          <h1 class="text-sm font-bold text-white">ICT Assist</h1>
          <p class="text-[11px] text-slate-400">Employee Portal</p>
        </div>
      </div>
      <nav class="space-y-1 text-xs font-semibold">
        <a href="employee-dashboard.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Dashboard</span></a>
        <a href="new-request.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="plus-circle" class="w-4 h-4"></i><span>New Request</span></a>
        <a href="ticket-status.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-blue-600 text-white"><i data-lucide="clock" class="w-4 h-4"></i><span>Ticket Status</span></a>
        <a href="notifications.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="bell" class="w-4 h-4"></i><span>Notifications</span></a>
        <a href="profile.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="user" class="w-4 h-4"></i><span>Profile</span></a>
      </nav>
    </div>
  </aside>

  <main class="flex-1 p-8 max-w-5xl mx-auto space-y-4">
    <div class="flex justify-between items-center">
      <h2 class="text-lg font-bold text-slate-900">Incident Ticket Status</h2>
      <div class="flex gap-1 text-xs bg-slate-200 p-1 rounded-xl">
        <button onclick="renderTable('All')" class="px-3 py-1 rounded-lg bg-white font-semibold text-blue-600">All</button>
        <button onclick="renderTable('Pending')" class="px-3 py-1 rounded-lg text-slate-600">Pending</button>
        <button onclick="renderTable('In Progress')" class="px-3 py-1 rounded-lg text-slate-600">In Progress</button>
        <button onclick="renderTable('Resolved')" class="px-3 py-1 rounded-lg text-slate-600">Resolved</button>
      </div>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-xs">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-50 border-b border-slate-100 text-slate-400 uppercase">
          <tr>
            <th class="py-3 px-6">ID</th>
            <th class="py-3 px-4">Title</th>
            <th class="py-3 px-4">Category</th>
            <th class="py-3 px-4">Priority</th>
            <th class="py-3 px-4">Status</th>
            <th class="py-3 px-4">Assigned Tech</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function renderTable(filter = 'All') {
      const all = getTickets();
      const list = filter === 'All' ? all : all.filter(t => t.status === filter);
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = list.map(t => `
        <tr class="hover:bg-slate-50">
          <td class="py-3.5 px-6 font-mono font-bold text-blue-600">#${t.id}</td>
          <td class="py-3.5 px-4 font-semibold text-slate-800">${t.title}<div class="text-[10px] text-slate-400">${t.branch}</div></td>
          <td class="py-3.5 px-4 text-slate-500">${t.category}</td>
          <td class="py-3.5 px-4"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${t.priority === 'High' ? 'bg-rose-50 text-rose-600' : 'bg-amber-50 text-amber-600'}">${t.priority}</span></td>
          <td class="py-3.5 px-4"><span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${t.status === 'Resolved' ? 'bg-emerald-50 text-emerald-700' : t.status === 'In Progress' ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700'}">${t.status}</span></td>
          <td class="py-3.5 px-4 text-slate-600">${t.assignedTo || '<span class="text-slate-400 italic">Unassigned</span>'}</td>
        </tr>
      `).join('');
    }
    renderTable();
  </script>
</body>
</html>
