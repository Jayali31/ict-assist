<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifications - ICT Assist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 flex min-h-screen">
  <aside class="w-64 bg-[#111827] text-slate-300 min-h-screen flex flex-col justify-between p-4 border-r border-slate-800">
    <div class="p-3 border-b border-slate-800 flex items-center space-x-3 mb-4">
      <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white"><i data-lucide="monitor" class="w-5 h-5"></i></div>
      <div><h1 class="text-sm font-bold text-white">ICT Assist</h1><p class="text-[11px] text-slate-400">Portal Alerts</p></div>
    </div>
    <nav class="space-y-1 text-xs font-semibold">
      <a href="employee-dashboard.html" class="flex items-center space-x-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Back to Dashboard</span></a>
    </nav>
  </aside>

  <main class="flex-1 p-8 max-w-4xl mx-auto space-y-4">
    <h2 class="text-xl font-bold text-slate-900">Notifications & Alerts</h2>
    <div class="space-y-3 text-xs">
      <div class="p-4 bg-white rounded-2xl border border-blue-200 shadow-xs flex items-start gap-3">
        <span class="w-2 h-2 rounded-full bg-blue-600 mt-1.5 shrink-0"></span>
        <div>
          <p class="font-bold text-slate-800">Technician assigned to your ticket #TX-2024</p>
          <p class="text-slate-500">K.P. Ratnasiri will visit your branch today.</p>
        </div>
      </div>
      <div class="p-4 bg-white rounded-2xl border border-slate-200 shadow-xs flex items-start gap-3">
        <span class="w-2 h-2 rounded-full bg-emerald-500 mt-1.5 shrink-0"></span>
        <div>
          <p class="font-bold text-slate-800">Work started on ticket #TX-2024</p>
          <p class="text-slate-500">Technician is at your branch.</p>
        </div>
      </div>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
